apiVersion: batch/v1
kind: Job
metadata:
  name: "pre-sync.{{ .Release.Name }}"
  labels:
    version: "v{{ .Values.microservice.version }}"
  # finalizers:
  #   - resources-finalizer.argocd.argoproj.io/foreground
  annotations:
    # argocd.argoproj.io/sync-wave: "{{ .syncWave }}"
    argocd.argoproj.io/hook: PreSync
spec:
  ttlSecondsAfterFinished: 3600
  trigger:
    startAfter: "{{ now | dateModify "+3m" }}"
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: sync-app
          image: quay.io/argoproj/argocd:v2.13.3
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - |
              argocd app sync {{ .Release.Namespace }}/{{ .Release.Name }} --server=https://local-argocd-control-plane --insecure
          # argocd app sync {{ .Release.Namespace }}/{{ .Release.Name }} --grpc-web --server=argocd-server.argocd.svc.cluster.local
