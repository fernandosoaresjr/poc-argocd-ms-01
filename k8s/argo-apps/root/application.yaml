apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root.poc-argocd-ms-01
  namespace: argocd
  labels:
    root: "true"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    repoURL: 'https://github.com/fernandosoaresjr/poc-argocd-ms-01'
    targetRevision: poc-multi-cluster
    path: k8s/argo-apps/parent/

    helm:
      releaseName: parent-poc-argocd-ms-01

  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
