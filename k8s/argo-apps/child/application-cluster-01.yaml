apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cluster-01.poc-argocd-ms-01
  namespace: argocd
  labels:
    version: v1.5.0
spec:
  project: default
  source:
    repoURL: 'https://github.com/fernandosoaresjr/poc-argocd-ms-01'
    targetRevision: poc-multi-cluster
    path: k8s/microservice/
  destination:
    name: kind-local-01
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
