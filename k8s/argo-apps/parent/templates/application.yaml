apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parent.poc-argocd-ms-01
  namespace: argocd
  labels:
    parent: "true"
    version: "v{{ .Values.version }}"
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  source:
    # Can point to either a Helm chart repo or a git repo.
    # In this case, we are pointing to a git repo.
    repoURL: 'https://github.com/fernandosoaresjr/poc-argocd-ms-01'
    # For Helm, this refers to the chart version.
    # For git, this refers to the git revision (e.g. branch, tag, commit).
    targetRevision: poc-multi-cluster
    # This has no meaning for Helm charts pulled directly from a Helm repo instead of git.
    # For git, this refers to the path within the repo.
    path: k8s/argo-apps/child/

    # helm specific config
    helm:
      # Release name override (defaults to application name)
      # We need to set this because we are using `.` in the application name, which is not allowed in Helm release names
      releaseName: parent-poc-argocd-ms-01
      # Extra parameters to set (same as setting through values.yaml, but these take precedence)
      # This is equivalent to `--set microservice.version={{ .Values.version}}`
      # We'll use this as hack to set the version of the microservice, in order to achieve the desired behavior of deploying in multi-cluster
      parameters:
        - name: version
          value: {{ .Values.version }}
  destination:
    name: in-cluster
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
